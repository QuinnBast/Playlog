# Runs the unit tests on every push and pull request: everything on Linux against a throwaway Postgres, and the agent
# alone on Windows (no server dependencies there - the agent is standard library only, like on the Deck).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # same as the Dockerfile
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  agent-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run agent tests (server tests skip themselves)
        run: python -m unittest discover -s tests -v

  agent-oldest-python:
    # SteamOS's system Python changes with OS updates; keep the agent working on 3.10+.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Run agent tests
        run: python -m unittest discover -s tests -v
